spring.application.name=gestion-cours

# Port dynamique fourni par Render au runtime (fallback 8080 en local)
server.port=${PORT:8080}

# Connexion MySQL — valeurs injectées via variables d'environnement sur Render,
# jamais écrites en dur ici pour éviter de committer des identifiants sensibles.
# En local, définis ces variables dans ton terminal ou ton IDE avant de lancer l'appli.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecte Hibernate pour MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# update = crée/adapte les tables automatiquement selon tes entités JPA au démarrage.
# Pratique en dev, mais à surveiller en prod (ne supprime jamais de données existantes,
# mais peut modifier le schéma de façon inattendue). Passe à "validate" une fois stable.
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans les logs, utile pour déboguer (désactive en prod si trop verbeux)
spring.jpa.show-sql=true
